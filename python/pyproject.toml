[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monamail"
version = "0.1.1"
description = "SDK gửi email giao dịch cho người Việt và AI agent"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MONA Software", email = "info@themona.global" }]
keywords = ["email", "transactional email", "vietnam", "otp email", "monamail", "smtp api", "email api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://monamail.vn"
Documentation = "https://monamail.vn/docs"
Repository = "https://github.com/mona-software/monamail"

[tool.setuptools.packages.find]
include = ["monamail*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
